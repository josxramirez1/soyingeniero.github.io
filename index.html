<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soy Ingeniero Informático</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0b14;
      overflow: hidden;
    }
    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    h1 {
      position: relative;
      z-index: 1;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      color: red;
      font-size: clamp(2rem, 6vw, 4.5rem);
      text-align: center;
      padding: 0 16px;
      animation: aparecer 1s ease-out;
    }
    @keyframes aparecer {
      from { transform: scale(0.6); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas id="fuegos"></canvas>
  <h1>SOY UN INGENIERO INFORMATICO ARRECHISIMO</h1>

  <script>
    const canvas = document.getElementById('fuegos');
    const ctx = canvas.getContext('2d');
    let W, H;

    function ajustar() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    ajustar();
    window.addEventListener('resize', ajustar);

    const colores = ['#ff3b3b', '#ffd23f', '#3bff8a', '#3bc8ff', '#c43bff', '#ff8a3b', '#ffffff'];
    const GRAVEDAD = 0.15;
    const cohetes = [];
    const particulas = [];

    // Lanza un cohete desde abajo hacia una altura aleatoria
    function lanzar() {
      const altura = H * (0.4 + Math.random() * 0.3);
      cohetes.push({
        x: W * (0.15 + Math.random() * 0.7),
        y: H,
        vx: (Math.random() - 0.5) * 2,
        vy: -Math.sqrt(2 * GRAVEDAD * altura),
        color: colores[Math.floor(Math.random() * colores.length)]
      });
    }

    // Convierte un cohete en una explosión de partículas
    function explotar(c) {
      for (let i = 0; i < 90; i++) {
        const angulo = Math.random() * Math.PI * 2;
        const velocidad = 1 + Math.random() * 5;
        particulas.push({
          x: c.x,
          y: c.y,
          vx: Math.cos(angulo) * velocidad,
          vy: Math.sin(angulo) * velocidad,
          vida: 1,
          desgaste: 0.012 + Math.random() * 0.01,
          color: Math.random() < 0.7 ? c.color : '#ffffff'
        });
      }
    }

    let animando = true;

    function animar() {
      // Borra poco a poco para dejar estela
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';

      for (let i = cohetes.length - 1; i >= 0; i--) {
        const c = cohetes[i];
        c.x += c.vx;
        c.y += c.vy;
        c.vy += GRAVEDAD;
        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        if (c.vy >= 0) {
          explotar(c);
          cohetes.splice(i, 1);
        }
      }

      for (let i = particulas.length - 1; i >= 0; i--) {
        const p = particulas[i];
        p.vx *= 0.98;
        p.vy = p.vy * 0.98 + 0.05;
        p.x += p.vx;
        p.y += p.vy;
        p.vida -= p.desgaste;
        if (p.vida <= 0) {
          particulas.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = p.vida;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (animando || cohetes.length || particulas.length) {
        requestAnimationFrame(animar);
      } else {
        ctx.clearRect(0, 0, W, H);
      }
    }

    // Al entrar: fuegos artificiales durante 6 segundos
    const intervalo = setInterval(lanzar, 350);
    setTimeout(() => {
      clearInterval(intervalo);
      animando = false;
    }, 6000);
    lanzar();
    animar();
  </script>
</body>
</html>
